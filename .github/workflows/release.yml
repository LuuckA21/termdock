name: Release

# Builds installers for Windows (MSI/NSIS), macOS (universal DMG) and Linux
# (AppImage/deb/rpm) into a DRAFT release, to be tested and published by hand.
#
# Normal flow: a PR bumps the version with `node scripts/version.mjs set X.Y.Z`;
# when it lands on main this workflow sees a version without a tag, creates the
# `vX.Y.Z` tag on that commit and builds the release, using the CHANGELOG
# section as release notes. Pushes to main that keep the version do nothing.
#
# Also possible: push a `v*` tag, or run it by hand (Actions -> Release).
#
# In-app updates: every package is signed with the updater key, kept as
# secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD of
# the `release` environment (deployments limited to main and v* tags, so
# workflows on other branches cannot read them); the public key is in
# tauri.conf.json. The last job verifies the uploaded packages against that
# public key and attaches latest.json, which installed apps read from the
# latest *published* release: never publish a draft without latest.json.
on:
  push:
    branches: [main]
    paths: [src-tauri/tauri.conf.json]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Resolve the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/version.mjs check
          tag="v$(node scripts/version.mjs get)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          exists=false
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then exists=true; fi

          case "$GITHUB_EVENT_NAME:$GITHUB_REF_TYPE" in
            push:tag)
              if [ "$GITHUB_REF_NAME" != "$tag" ]; then
                echo "::error::tag $GITHUB_REF_NAME does not match the app version ($tag)"
                exit 1
              fi
              release=true ;;
            push:branch)
              if [ "$exists" = true ]; then
                echo "$tag already released, nothing to do"
                release=false
              else
                release=true
              fi ;;
            *)
              if [ "$exists" = true ]; then
                echo "::error::$tag already exists; bump the version with scripts/version.mjs first"
                exit 1
              fi
              release=true ;;
          esac
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "create_tag=$([ "$release" = true ] && [ "$exists" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Fail before tagging if the updater signing setup is incomplete or the
      # private key does not match the public key built into the app.
      - name: Install the Tauri CLI
        if: steps.version.outputs.release == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the updater signing key
        if: steps.version.outputs.release == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is not set in the release environment (see README, Development)"
            exit 1
          fi
          node scripts/updater-manifest.mjs check-config
          probe="$RUNNER_TEMP/key-probe"
          echo "termdock updater key probe" > "$probe"
          ./node_modules/.bin/tauri signer sign "$probe" >/dev/null
          node scripts/updater-manifest.mjs verify "$probe" "$probe.sig"
      - name: Create the tag
        if: steps.version.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="Termdock $TAG" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha" >/dev/null
          echo "Created $TAG on $GITHUB_SHA"

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-24.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release notes
        shell: bash
        run: node scripts/version.mjs release-notes > "$RUNNER_TEMP/notes.md"
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<TERMDOCK_NOTES_EOF"
            cat "$RUNNER_TEMP/notes.md"
            echo "TERMDOCK_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional code signing, configure these secrets to enable it:
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (macOS notarization).
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Termdock ${{ needs.prepare.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # Written by the `updater` job once every platform is uploaded:
          # parallel jobs updating one latest.json could overwrite each other.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  updater:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Verify the packages and attach latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          dir="$RUNNER_TEMP/assets"
          gh release download "$TAG" --dir "$dir" \
            --pattern '*_x64-setup.exe*' --pattern '*_x64_en-US.msi*' \
            --pattern '*.app.tar.gz*' --pattern '*_amd64.AppImage*'
          node scripts/updater-manifest.mjs build "$TAG" "$dir"
          gh release upload "$TAG" "$dir/latest.json" --clobber
