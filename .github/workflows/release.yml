name: Release

# Builds installers for Windows (MSI/NSIS), macOS (universal DMG) and Linux
# (AppImage/deb/rpm) into a DRAFT release, to be tested and published by hand.
#
# Normal flow: a PR bumps the version with `node scripts/version.mjs set X.Y.Z`;
# when it lands on main this workflow sees a version without a tag, creates the
# `vX.Y.Z` tag on that commit and builds the release, using the CHANGELOG
# section as release notes. Pushes to main that keep the version do nothing.
#
# Also possible: push a `v*` tag, or run it by hand (Actions -> Release).
on:
  push:
    branches: [main]
    paths: [src-tauri/tauri.conf.json]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Resolve the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/version.mjs check
          tag="v$(node scripts/version.mjs get)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          exists=false
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then exists=true; fi

          case "$GITHUB_EVENT_NAME:$GITHUB_REF_TYPE" in
            push:tag)
              if [ "$GITHUB_REF_NAME" != "$tag" ]; then
                echo "::error::tag $GITHUB_REF_NAME does not match the app version ($tag)"
                exit 1
              fi
              release=true ;;
            push:branch)
              if [ "$exists" = true ]; then
                echo "$tag already released, nothing to do"
                release=false
              else
                release=true
              fi ;;
            *)
              if [ "$exists" = true ]; then
                echo "::error::$tag already exists; bump the version with scripts/version.mjs first"
                exit 1
              fi
              release=true ;;
          esac
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "create_tag=$([ "$release" = true ] && [ "$exists" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Create the tag
        if: steps.version.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="Termdock $TAG" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha" >/dev/null
          echo "Created $TAG on $GITHUB_SHA"

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-24.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release notes
        shell: bash
        run: node scripts/version.mjs changelog > "$RUNNER_TEMP/notes.md"
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<TERMDOCK_NOTES_EOF"
            cat "$RUNNER_TEMP/notes.md"
            echo "TERMDOCK_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing, configure these secrets to enable it:
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (macOS notarization).
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Termdock ${{ needs.prepare.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
