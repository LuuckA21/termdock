name: Release

# Builds installers for Windows (MSI/NSIS), macOS (universal DMG) and Linux
# (AppImage/deb/rpm) into a DRAFT release, to be tested and published by hand.
# Linux packages are built in an Ubuntu 22.04 container (glibc 2.35), so they
# also run on distributions older than the runner's.
#
# Normal flow: a PR bumps the version with `node scripts/version.mjs set X.Y.Z`;
# when it lands on main this workflow sees a version without a tag, creates the
# `vX.Y.Z` tag on that commit and builds the release, using the CHANGELOG
# section as release notes. Pushes to main that keep the version do nothing.
#
# Also possible: run it by hand on main (Actions -> Release) for a version
# without a tag. There is no tag trigger: a tag can point at any commit, and
# a tag-triggered run uses that commit's (unreviewed) copy of this file.
# If a run fails, use "Re-run failed jobs": a whole new run sees the tag
# that the first one created and does nothing.
#
# In-app updates: every package is signed with the updater key, kept as
# secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD of
# the `release` environment (deployments limited to the main branch, so
# workflows on other branches or tags cannot read them); the public key is in
# tauri.conf.json. The last job verifies the uploaded packages against that
# public key and attaches latest.json, which installed apps read from the
# latest *published* release: never publish a draft without latest.json.
on:
  push:
    branches: [main]
    paths: [src-tauri/tauri.conf.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Resolve the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/version.mjs check
          tag="v$(node scripts/version.mjs get)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          exists=false
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then exists=true; fi

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::releases are built from main only (this run is on $GITHUB_REF)"
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            push)
              if [ "$exists" = true ]; then
                echo "$tag already released, nothing to do"
                release=false
              else
                release=true
              fi ;;
            *)
              if [ "$exists" = true ]; then
                echo "::error::$tag already exists; bump the version with scripts/version.mjs first"
                exit 1
              fi
              release=true ;;
          esac
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "create_tag=$([ "$release" = true ] && [ "$exists" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Fail before tagging if the updater signing setup is incomplete or the
      # private key does not match the public key built into the app.
      - name: Install the Tauri CLI
        if: steps.version.outputs.release == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the updater signing key
        if: steps.version.outputs.release == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is not set in the release environment (see README, Development)"
            exit 1
          fi
          node scripts/updater-manifest.mjs check-config
          probe="$RUNNER_TEMP/key-probe"
          echo "termdock updater key probe" > "$probe"
          ./node_modules/.bin/tauri signer sign "$probe" >/dev/null
          node scripts/updater-manifest.mjs verify "$probe" "$probe.sig"
      - name: Create the tag
        if: steps.version.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="Termdock $TAG" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha" >/dev/null
          echo "Created $TAG on $GITHUB_SHA"
      # One draft for all the build legs: tauri-action creates the release only
      # after building, so parallel legs finishing together each made their own.
      - name: Create the draft release
        id: draft
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          count=$(printf '%s' "$releases" | grep -c . || true)
          if [ "$count" -gt 1 ]; then
            echo "::error::$count releases exist for $TAG; delete the extra drafts first"
            exit 1
          elif [ "$count" -eq 1 ]; then
            read -r id draft <<< "$releases"
            if [ "$draft" != true ]; then
              echo "::error::$TAG is already published"
              exit 1
            fi
            echo "Reusing draft release $id"
          else
            node scripts/version.mjs release-notes > "$RUNNER_TEMP/notes.md"
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="Termdock $TAG" \
              -F body=@"$RUNNER_TEMP/notes.md" -F draft=true -F prerelease=false --jq .id)
            echo "Created draft release $id"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional code signing, configure these secrets to enable it:
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (macOS notarization).
        with:
          # The draft created by `prepare`: every leg uploads to the same one.
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # Written by the `updater` job once every platform is uploaded:
          # parallel jobs updating one latest.json could overwrite each other.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # Linux on its own: built inside Ubuntu 22.04 (pinned by digest), not on
  # the runner's newer system, so the packages need only glibc 2.35. Keep the
  # package list in step with the linux-packages job in ci.yml.
  build-linux:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04@sha256:0a9887931b0e38af2e3487ed39e29436b0535c4f3f52e57745baaf79d1898956
    env:
      DEBIAN_FRONTEND: noninteractive
      # No FUSE in a container: AppImage tools unpack themselves instead.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get upgrade -y
          apt-get install -y --no-install-recommends build-essential ca-certificates curl wget file git \
            pkg-config xdg-utils libssl-dev libxdo-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libdbus-1-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: false
      - name: Check the glibc the app needs
        run: scripts/glibc-max.sh target/release/termdock 2.35

  updater:
    needs: [prepare, build, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Verify the packages and attach latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          dir="$RUNNER_TEMP/assets"
          gh release download "$TAG" --dir "$dir" \
            --pattern '*_x64-setup.exe*' --pattern '*_x64_en-US.msi*' \
            --pattern '*.app.tar.gz*' --pattern '*_amd64.AppImage*'
          node scripts/updater-manifest.mjs build "$TAG" "$dir"
          gh release upload "$TAG" "$dir/latest.json" --clobber
