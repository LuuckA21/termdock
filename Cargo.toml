[workspace]
resolver = "3"
members = ["crates/termdock-core", "src-tauri"]

[workspace.package]
version = "0.18.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Luca Dalù"]

[workspace.dependencies]
termdock-core = { path = "crates/termdock-core" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
