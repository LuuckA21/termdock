[package]
name = "termdock"
description = "Terminal & connection manager with a favorites bar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "termdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-clipboard-manager = "2.5"
termdock-core.workspace = true
directories = "6"
tokio.workspace = true
serde.workspace = true
# Needed by `generate_context!` for the plugin configuration.
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-dialog = "2.8"
tempfile = "3"
tauri-plugin-window-state = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-notification = "2.7"
url = "2.5"
